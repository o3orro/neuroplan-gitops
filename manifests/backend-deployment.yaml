apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroplan-backend
  namespace: neuroplan

spec:
  replicas: 2

  selector:
    matchLabels:
      app: neuroplan-backend

  template:
    metadata:
      labels:
        app: neuroplan-backend

    spec:
      containers:
        - name: neuroplan-backend
          image: yerinnn/neuroplan-backend:9

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
