apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroplan-frontend
  namespace: neuroplan

spec:
  replicas: 2

  selector:
    matchLabels:
      app: neuroplan-frontend

  template:
    metadata:
      labels:
        app: neuroplan-frontend

    spec:
      containers:
        - name: neuroplan-frontend
          image: yerinnn/neuroplan-frontend:21

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
